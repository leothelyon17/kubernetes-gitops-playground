image:
  repository: ghcr.io/kube-vip/kube-vip
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

config:
  address: "192.168.101.160"

# Check https://kube-vip.io/docs/installation/flags/
env:
  # Empty so each control-plane pod binds the default-route NIC:
  # eno1 on node2 and node3, enp1s0 on node6.
  vip_interface: ""
  vip_arp: "true"
  lb_enable: "true"
  lb_port: "6443"
  #vip_cidr: "32"
  svc_enable: "false"
  cp_enable: "true"

nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
