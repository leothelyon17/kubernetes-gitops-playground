# INIT-003/SPEC-004: CSI prefix matches the operator namespace; clusterID is this backend only.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-cephfs-node6-retain
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph-node6
  fsName: k8s-ceph-node6-fs
  pool: k8s-ceph-node6-fs-replicated
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph-node6
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph-node6
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph-node6
reclaimPolicy: Retain
allowVolumeExpansion: true
