# INIT-003/SPEC-004: CSI prefix matches the operator namespace; clusterID is this backend only.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-cephfs-heavy-delete
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph-heavy
  fsName: k8s-ceph-heavy-fs
  pool: k8s-ceph-heavy-fs-replicated
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph-heavy
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph-heavy
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph-heavy
reclaimPolicy: Delete
allowVolumeExpansion: true
